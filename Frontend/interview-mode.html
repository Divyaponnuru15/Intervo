<section class="mode-page">

    <div class="mode-container">

        <h1 id="selectedInterview">
            HR Interview
        </h1>

        <p class="mode-subtitle">
            Choose how you want to practice your interview.
        </p>


        <div class="mode-options">

            <!-- TEXT -->
            <div class="mode-card">

                <div class="mode-icon">
                    💬
                </div>

                <h2>Text Interview</h2>

                <p>
                    Type your answers and receive
                    AI-powered feedback.
                </p>

                <button
                    id="textInterviewButton"
                    class="mode-button"
                >
                    Start Text Interview →
                </button>

            </div>


            <!-- VOICE -->
            <div class="mode-card">

                <div class="mode-icon">
                    🎤
                </div>

                <h2>Voice Interview</h2>

                <p>
                    Speak your answers and receive
                    AI-powered feedback.
                </p>

                <button
                    id="voiceInterviewButton"
                    class="mode-button"
                >
                    Start Voice Interview →
                </button>

            </div>

        </div>

    </div>

</section>
